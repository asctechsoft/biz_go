name: bizgo
description: "BizGo - Quản lý bán hàng, giao hàng, công nợ."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_messaging: ^16.0.0

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

  # Local image handling (compress + save)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Misc UI
  url_launcher: ^6.3.1
  flutter_slidable: ^4.0.0
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Icon launcher: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_app.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_app.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
